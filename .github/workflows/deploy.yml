name: deploy

# Production on Cloudflare after a promotion: docs/adr/0010-branches-and-ci.md, docs/adr/0015-backend-and-shared-library.md
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Its protection rules hold the run for the maintainer's approval and allow main only.
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Apply the D1 migrations
        run: pnpm --filter @openlinguo/api exec wrangler d1 migrations apply openlinguo --remote
      # --branch=main makes it the production deployment: any other branch would be a preview on the production database.
      - name: Deploy the PWA and the Functions
        run: pnpm --filter @openlinguo/api exec wrangler pages deploy --cwd ../web --branch=main
      - name: Deploy the cron Worker
        run: pnpm --filter @openlinguo/api exec wrangler deploy
