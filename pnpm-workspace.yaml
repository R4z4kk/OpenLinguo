packages:
  - apps/*
  - packages/*
  - tools/*

# Supply chain: never install a version published less than 7 days ago.
minimumReleaseAge: 10080

# Supply chain: dependency build scripts run only when listed in `allowBuilds` (none today);
# an unreviewed one fails the install (https://pnpm.io/settings/build). Already pnpm 12's
# default, stated here so a default change cannot weaken it silently.
strictDepBuilds: true
