# Mandarin TTS for the pipeline (ADR 0007), ports bound to localhost. It needs the Radeon through WSL2
# (see rocm-wsl/Dockerfile); run one service at a time on the 24 GB card.
x-radeon: &radeon
  devices: ["/dev/dxg"]
  volumes:
    - "/usr/lib/wsl/lib:/usr/lib/wsl/lib:ro"
    - "./voices:/voices:ro"
    - "models:/models"
    - "hf-cache:/root/.cache"

services:
  moss-voice-generator:
    build: { context: ./moss-tts, dockerfile: Dockerfile }
    image: openlinguo-tts-moss
    <<: *radeon
    environment:
      MODEL_KIND: voice-generator
      MODEL_REPO: OpenMOSS-Team/MOSS-VoiceGenerator
      MODEL_REVISION: 97521ec2b6f3ec5026ac1f5751f8fc302d82c2d4
      CODEC_REPO: OpenMOSS-Team/MOSS-Audio-Tokenizer
      CODEC_REVISION: 3cd226ba2947efa357ef453bcad111b6eafba782
    ports: ["127.0.0.1:8105:8000"]

  moss-tts:
    image: openlinguo-tts-moss
    <<: *radeon
    environment:
      MODEL_KIND: tts
      MODEL_REPO: OpenMOSS-Team/MOSS-TTS-v1.5
      MODEL_REVISION: cdd3b911b1585e3f2dbc7775ef10f9926f58850a
      CODEC_REPO: OpenMOSS-Team/MOSS-Audio-Tokenizer
      CODEC_REVISION: 3cd226ba2947efa357ef453bcad111b6eafba782
      REFERENCE_WAV: /voices/designed-zh-female.wav
      CODEC_DTYPE: bfloat16
      PYTORCH_HIP_ALLOC_CONF: expandable_segments:True
    ports: ["127.0.0.1:8106:8000"]

  # Speech recognition to catch words the TTS adds (#113)
  whisper:
    build: { context: ./asr-hf, dockerfile: Dockerfile }
    image: openlinguo-asr-hf
    <<: *radeon
    environment:
      MODEL_KIND: whisper
      MODEL_REPO: openai/whisper-large-v3
      MODEL_REVISION: 06f233fe06e710322aca913c1bc4249a0d71fce1
    ports: ["127.0.0.1:8120:8000"]

  qwen3-asr:
    image: openlinguo-asr-hf
    <<: *radeon
    environment:
      MODEL_KIND: qwen3-asr
      MODEL_REPO: Qwen/Qwen3-ASR-1.7B
      MODEL_REVISION: 7278e1e70fe206f11671096ffdd38061171dd6e5
    ports: ["127.0.0.1:8121:8000"]

  firered-asr:
    build: { context: ./firered-asr, dockerfile: Dockerfile }
    image: openlinguo-asr-firered
    <<: *radeon
    environment:
      MODEL_REPO: FireRedTeam/FireRedASR2-AED
      MODEL_REVISION: 2304afed56eacfee6256dee5937ed22ffa0b64ec
    ports: ["127.0.0.1:8122:8000"]

volumes:
  models:
  hf-cache:
